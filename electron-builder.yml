appId: com.lnreader.app
productName: LN Reader
copyright: MIT License

directories:
  output: release
  buildResources: resources

# Chỉ đóng gói bản build, không mang theo source
files:
  - apps/main/dist/**/*
  - package.json
  - '!**/*.map'

# better-sqlite3 là native module — phải giữ nguyên file .node,
# không cho asar nén vào trong
asarUnpack:
  - '**/*.node'

# Chỉ mang những package không bundle được vào bundle chính
extraMetadata:
  main: apps/main/dist/index.cjs

npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Không mua code signing certificate — user sẽ thấy SmartScreen warning,
  # README hướng dẫn "More info → Run anyway"
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Sidecar Python và catalog voice đi kèm bản cài, KHÔNG nằm trong asar.
#
# - Sidecar phải là file thật trên đĩa: nó được `spawn` như tiến trình riêng,
#   mà Windows không chạy được .exe nằm trong asar.
# - Đích khớp `resolveSidecarCommand()` / `resolveVoiceCatalogPath()` ở
#   `apps/main/src/services/sidecar-paths.ts`. Đổi một bên phải đổi bên kia,
#   nếu không bản đóng gói không tìm thấy sidecar trong khi mọi unit test vẫn xanh.
#
# `sidecar/dist/ln-sidecar/` do `python sidecar/build.py` sinh ra. `pnpm build:win`
# tự gọi `build:sidecar` rồi `scripts/sidecar-preflight.mjs` trước khi tới đây,
# nên không còn phải nhớ chạy tay.
#
# LƯU Ý: electron-builder **không** báo lỗi khi `from:` không tồn tại — nó chép
# được gì thì chép rồi báo thành công. Vì vậy việc chặn nằm ở preflight, đừng
# trông vào chỗ này.
extraResources:
  - from: sidecar/dist/ln-sidecar
    to: sidecar
  - from: resources/voices
    to: voices

# Không bundle voice model / aligner — tải runtime từ Hugging Face
