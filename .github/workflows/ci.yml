name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hủy lần chạy cũ khi có commit mới trên cùng nhánh
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Không khai báo `version` — action tự đọc `packageManager` trong
      # package.json. Khai cả hai chỗ sẽ lỗi ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # better-sqlite3 chưa có prebuild cho Node > 22 — xem .nvmrc
          node-version-file: .nvmrc
          cache: pnpm

      # Sidecar dùng 3.12 trên máy dev (PROGRESS mục 5.4). Ghim cùng phiên bản
      # ở CI để lỗi phụ thuộc phiên bản không chỉ hiện ở một trong hai chỗ.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements-dev.txt

      - run: pnpm install --frozen-lockfile

      # `pnpm test:sidecar` tự bỏ qua khi thiếu venv, nên nếu bước này hỏng thì
      # pytest sẽ im lặng không chạy mà job vẫn xanh. Dựng venv là bước riêng để
      # lỗi cài đặt hiện ra ngay tại đây.
      - name: Dựng venv cho sidecar
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/Scripts/python.exe -m pip install --upgrade pip
          sidecar/.venv/Scripts/python.exe -m pip install -r sidecar/requirements-dev.txt

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Nợ mức Thấp/TB ở PROGRESS mục 8 đã đóng: pytest chạy trong cùng job
      # `check` thay vì phải gọi tay trên máy dev.
      - run: pnpm test:sidecar

  build:
    name: Build Windows portable
    runs-on: windows-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      # Không khai báo `version` — action tự đọc `packageManager` trong
      # package.json. Khai cả hai chỗ sẽ lỗi ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements-dev.txt

      - run: pnpm install --frozen-lockfile

      # `pnpm build:win` gọi `build:sidecar` → PyInstaller, nên venv là bắt buộc
      # ở job này. Thiếu venv thì `sidecar-build.mjs` thoát khác 0 và job đỏ —
      # đúng ý muốn, nhưng dựng sẵn ở đây để không đỏ oan.
      - name: Dựng venv cho sidecar
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/Scripts/python.exe -m pip install --upgrade pip
          sidecar/.venv/Scripts/python.exe -m pip install -r sidecar/requirements-dev.txt

      # Gồm cả `build:sidecar` + preflight — xem `scripts/sidecar-preflight.mjs`.
      - name: Build installer + portable
        run: pnpm build:win
        env:
          # Không code sign — chấp nhận SmartScreen warning
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Preflight chỉ kiểm PHÍA NGUỒN (`sidecar/dist/`). Còn đây kiểm phía ĐÍCH:
      # electron-builder có thật sự chép trọn onedir vào `resources/sidecar/` hay
      # không. Hai chỗ hỏng khác nhau — nợ mục 8 "chưa biết electron-builder có
      # chép trọn 145 MB onedir không".
      - name: Kiểm sidecar có trong bản đóng gói
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/resources/sidecar/ln-sidecar.exe"
          if (-not (Test-Path $exe)) { throw "Bản đóng gói thiếu sidecar: $exe" }

          $internal = "release/win-unpacked/resources/sidecar/_internal"
          if (-not (Test-Path $internal)) { throw "Thiếu _internal — onedir không đầy đủ" }

          $catalog = "release/win-unpacked/resources/voices/catalog.json"
          if (-not (Test-Path $catalog)) { throw "Thiếu catalog voice: $catalog" }

          $mb = [math]::Round((Get-ChildItem -Recurse "release/win-unpacked/resources/sidecar" |
            Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Sidecar trong bản đóng gói: $mb MB"

      - name: Kiểm tra bản đóng gói khởi động được
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/LN Reader.exe"
          if (-not (Test-Path $exe)) { throw "Không tìm thấy $exe" }

          $crash = Join-Path $env:APPDATA "LN Reader/logs/crash.log"
          Remove-Item $crash -ErrorAction SilentlyContinue

          # Biến này khiến Electron chạy như Node thuần → không mở cửa sổ nào.
          # Runner không đặt nó, nhưng xoá cho chắc để kết quả không phụ thuộc
          # môi trường (máy dev chạy trong terminal VS Code luôn có biến này).
          Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue

          Start-Process -FilePath $exe -ArgumentList "--remote-debugging-port=9222"

          # Chờ có điều kiện thay vì sleep cứng: runner chậm thì sleep 25s vẫn
          # fail giả, runner nhanh thì phí thời gian. Thử lại tối đa 60s.
          $page = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $targets = Invoke-RestMethod "http://127.0.0.1:9222/json/list" -TimeoutSec 5
              $page = $targets | Where-Object { $_.type -eq "page" } | Select-Object -First 1
              if ($page) { break }
            } catch {
              # Cổng debug chưa mở — bình thường trong vài giây đầu
            }
          }

          # Renderer phải nạp được — bắt lỗi đóng gói thiếu module
          if (-not $page) { throw "Renderer không nạp được sau 60s" }
          Write-Host "Renderer OK: $($page.url)"

          if (Test-Path $crash) {
            Get-Content $crash
            throw "App crash lúc khởi động"
          }

          Get-Process -Name "LN Reader" -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ln-reader-windows
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
          if-no-files-found: error
