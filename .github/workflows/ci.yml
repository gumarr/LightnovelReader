name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hủy lần chạy cũ khi có commit mới trên cùng nhánh
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Không khai báo `version` — action tự đọc `packageManager` trong
      # package.json. Khai cả hai chỗ sẽ lỗi ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # better-sqlite3 chưa có prebuild cho Node > 22 — xem .nvmrc
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  build:
    name: Build Windows portable
    runs-on: windows-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      # Không khai báo `version` — action tự đọc `packageManager` trong
      # package.json. Khai cả hai chỗ sẽ lỗi ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build installer + portable
        run: pnpm build:win
        env:
          # Không code sign — chấp nhận SmartScreen warning
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Kiểm tra bản đóng gói khởi động được
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/LN Reader.exe"
          if (-not (Test-Path $exe)) { throw "Không tìm thấy $exe" }

          $crash = Join-Path $env:APPDATA "LN Reader/logs/crash.log"
          Remove-Item $crash -ErrorAction SilentlyContinue

          # Biến này khiến Electron chạy như Node thuần → không mở cửa sổ nào.
          # Runner không đặt nó, nhưng xoá cho chắc để kết quả không phụ thuộc
          # môi trường (máy dev chạy trong terminal VS Code luôn có biến này).
          Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue

          Start-Process -FilePath $exe -ArgumentList "--remote-debugging-port=9222"

          # Chờ có điều kiện thay vì sleep cứng: runner chậm thì sleep 25s vẫn
          # fail giả, runner nhanh thì phí thời gian. Thử lại tối đa 60s.
          $page = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $targets = Invoke-RestMethod "http://127.0.0.1:9222/json/list" -TimeoutSec 5
              $page = $targets | Where-Object { $_.type -eq "page" } | Select-Object -First 1
              if ($page) { break }
            } catch {
              # Cổng debug chưa mở — bình thường trong vài giây đầu
            }
          }

          # Renderer phải nạp được — bắt lỗi đóng gói thiếu module
          if (-not $page) { throw "Renderer không nạp được sau 60s" }
          Write-Host "Renderer OK: $($page.url)"

          if (Test-Path $crash) {
            Get-Content $crash
            throw "App crash lúc khởi động"
          }

          Get-Process -Name "LN Reader" -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ln-reader-windows
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
          if-no-files-found: error
